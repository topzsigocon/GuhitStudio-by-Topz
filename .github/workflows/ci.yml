name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK + unit tests
        run: gradle assembleDebug testDebugUnitTest --stacktrace

      - name: Verify app stays offline (no INTERNET permission)
        run: |
          M=$(find app/build -path '*merged_manifests*' -name AndroidManifest.xml | grep -i debug | head -n1)
          test -n "$M" || { echo "merged manifest not found"; exit 1; }
          if grep -q 'android.permission.INTERNET' "$M"; then
            echo "INTERNET permission found in $M - not allowed"; exit 1
          fi
          echo "OK: no INTERNET permission"

      - uses: actions/upload-artifact@v4
        with:
          name: guhit-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
